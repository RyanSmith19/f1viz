[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "f1viz"
version = "0.1.0"
description = "Formula 1 race replay and storytelling analytics tool."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "polars>=1.0",
  "pydantic>=2.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.scripts]
f1viz = "f1viz.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

